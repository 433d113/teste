<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;font-family:-apple-system,Helvetica,Arial,sans-serif;font-size:17px}
body.dark{--bg:#14161a;--pn:#1f232a;--bd:#343a45;--tx:#ecebe6;--mu:#9aa3b2;--ac:#ff8a3d;--ab:#ffc247;--at:#14161a}

.b.wide{width:100%;margin:0 0 8px}

.in,select{width:100%;min-height:48px;font-size:17px;padding:0 12px;border:2px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font-family:inherit}
select{width:auto;flex:1;min-width:0}

.row{display:flex;align-items:center;border-bottom:1px solid var(--bd);padding:4px 8px}.row .rt{flex:1;padding:8px}

.mob{display:none}

#app.focus + #fsb{display:none}

@media (max-width:700px){
#side{width:100%;border-right:0}#main{display:none}
#app.nosb #side{display:flex}

#app.nosb + #fsb{display:none}
.bar .b{padding:0 10px;font-size:15px;min-height:44px}
.bar b.ttl{font-size:18px}.st{font-size:20px}
#rd{padding:8px 10px 160px}}
</style></head><body class="dark">
<div id="app">
<div id="side">
<div class="hd"><b>♪ Cifras</b><span><button class="b sq sbt" data-a="sbtog" title="Ocultar a lista">⇤</button><button class="b" data-a="theme" id="thm"></button></span></div>
<div class="tabs"><button class="b" id="tb_songs" data-a="tab:songs">Músicas</button><button class="b" id="tb_sets" data-a="tab:sets">Repertórios</button><button class="b" id="tb_cfg" data-a="tab:cfg">Backup</button></div>

</div>

</div>
<button id="fsb" class="b" data-a="sbtog">☰ Lista</button><button id="fex" class="b" data-a="zenx">✕ Sair da tela cheia</button>
<script>
var KEY='cifras_v1';
var D={songs:[],sets:[],cfg:{theme:'dark',fs:18,sp:3}};
var S={mm:false,folder:null,focus:false,sq:'',sqSet:null,ss:'set',gq:'',gs:'sets',tab:'songs',view:'home',sid:null,setId:null,idx:0,tr:0,addTo:null,editing:null,q:'',sel:0,sele:0};
var timer=null,acc=0;
function $(i){return document.getElementById(i);}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function uid(){return Date.now().toString(36)+Math.random().toString(36).substr(2,5);}
function load(){try{var r=localStorage.getItem(KEY);if(r){var d=JSON.parse(r);if(d&&d.songs){D=d;}}}catch(e){}
 D.sets=D.sets||[];D.cfg=D.cfg||{};D.cfg.theme=D.cfg.theme||'dark';D.cfg.fs=D.cfg.fs||((typeof window!=='undefined'&&window.innerWidth&&window.innerWidth<=700)?13:18);D.cfg.sp=D.cfg.sp||3;
 if(migrate()){save();}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(D));}catch(e){}}
function song(id){if(id===null||id===undefined){return null;}id=String(id);for(var i=0;i<D.songs.length;i++){if(String(D.songs[i].id)===id){return D.songs[i];}}return null;}
function setById(id){for(var i=0;i<D.sets.length;i++){if(D.sets[i].id===id){return D.sets[i];}}return null;}
function sorted(){return D.songs.slice().sort(function(a,b){return a.title.toLowerCase().localeCompare(b.title.toLowerCase());});}

/* ===== Acordes ===== */
var SH=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'],FL=['C','Db','D','Eb','E','F','Gb','G','Ab','A','Bb','B'];
var NI={C:0,'C#':1,Db:1,D:2,'D#':3,Eb:3,E:4,F:5,'F#':6,Gb:6,G:7,'G#':8,Ab:8,A:9,'A#':10,Bb:10,B:11,Cb:11,'B#':0,'E#':5,Fb:4};
var CRX=/^([A-G][#b\u266f\u266d]?)([^\/\s]*)(?:\/([^\s]+))?$/;
var STRONG=/^(parte|part|base|passagem|re-?intro|introd|tom|capo|capotraste|tonalidade|\d+[\u00b0\u00ba]?vez|intro|introdu[cç][aã]o|refr[aã]o|pr[eé]-?refr[aã]o|ponte|solo|final|coda|interl[uú]dio|verso|estrofe|outro|riff|instrumental|tab|tablatura|bis|repete|repetir|vezes|vez)$/i;
var CONN=/^(de|da|do|com|sem)$/i;
var WEAK=/^([+\-]\d+|\d+|\d+x|x\d+|x|[|\-\u2013\u2014\/%.*~=:><\u2192]+|n\.?c\.?)$/i;
var FLATPREF=false;
function normN(r){return r.replace('\u266f','#').replace('\u266d','b');}
/* Normaliza o texto: remove caracteres invisíveis, espaços especiais e tabs */
function norm(t){return t.replace(/[\u200b-\u200d\u2060\ufeff]/g,'').replace(/[\u00a0\u2000-\u200a\u202f\u205f\u3000]/g,' ').replace(/\r\n?/g,'\n').replace(/\t/g,'    ');}
/* Retorna [texto, raiz, sufixo, baixo] se o texto for um acorde válido (aceita "/" dentro de parênteses e baixos múltiplos) */
function chordParts(t){
 var m=/^([A-G][#b\u266f\u266d]?)(.*)$/.exec(t);if(!m||/\s/.test(m[2])){return null;}
 var rest=m[2],d=0,i,c,cut=-1,suf,bass,ps,j;
 for(i=0;i<rest.length;i++){c=rest.charAt(i);if(c==='('){d++;}else if(c===')'){d=d>0?d-1:0;}else if(c==='/'&&d===0){cut=i;break;}}
 suf=cut<0?rest:rest.substring(0,cut);bass=cut<0?undefined:rest.substring(cut+1);
 if(!/^[0-9#b\u266f\u266d+\-\u00ba\u00b0\u00f8\u2206\u0394^(),.\/]*$/.test(suf.replace(/maj|min|dim|aug|sus|add|alt|no|M|m/g,''))){return null;}
 if(bass!==undefined){if(!bass){return null;}ps=bass.split('/');
  for(j=0;j<ps.length;j++){if(!/^([A-G][#b\u266f\u266d]?|[0-9#b\u266f\u266d+\-()]+)$/.test(ps[j])){return null;}}}
 return [t,m[1],suf,bass];}
/* Aceita acorde puro ou com pontuação/prefixos em volta: (Am) [C] |G :F9 2x:G#m Solo:[E9 */
function parseTok(t){
 if(chordParts(t)){return {pre:'',core:t,post:''};}
 var m=/^((?:[A-Za-z\u00c0-\u00ff]+:)?(?:\d+x:?)?[\(\[\{|:?]*)(.+?)([\)\]\}|,.:;?]*(?:\d+x)?)$/.exec(t);
 if(m&&(m[1]||m[3])&&chordParts(m[2])){return {pre:m[1],core:m[2],post:m[3]};}
 return null;}
function cleanTok(t){return t.replace(/^[\(\[\{]+|[\)\]\}:;,.]+$/g,'');}
/* Tipo da palavra: c=acorde, l=rótulo de parte, k=conector, n=símbolo/número, w=palavra comum */
function tokKind(w){
 if(parseTok(w)){return 'c';}
 var x=cleanTok(w);
 if(STRONG.test(x)){return 'l';}
 if(CONN.test(x)){return 'k';}
 if(WEAK.test(w)||WEAK.test(x)||/^[^A-Za-z0-9]+$/.test(w)){return 'n';}
 if(/[|,;]/.test(w)){var q=w.split(/[|,;]+/),i,ok=0;
  for(i=0;i<q.length;i++){if(!q[i]){continue;}if(!parseTok(q[i])){return 'w';}ok++;}
  if(ok){return 'c';}}
 return 'w';}
/* Classifica a linha: 'chord' | 'label' | '' (letra) */
function lineType(l){
 var t=l.replace(/^\s+|\s+$/g,'');if(!t){return '';}
 var mb=/^\s*\[([^\]]*)\](.*)$/.exec(l);
 if(mb&&/\S/.test(mb[1])){var inn=mb[1].split(/\s+/),ic=0,q;for(q=0;q<inn.length;q++){if(parseTok(inn[q])){ic++;}}
  if(!ic){var rem=mb[2].replace(/^\s+|\s+$/g,'');if(!rem){return 'label';}var rt=lineType(rem);if(rt==='chord'||rt==='label'){return rt;}}}
 var p=t.split(/\s+/),c=0,L=0,k=0,o=0,i,kd;
 for(i=0;i<p.length;i++){kd=tokKind(p[i]);
  if(kd==='c'){c++;}else if(kd==='l'){L++;}else if(kd==='k'){k++;}else if(kd==='w'){o++;}}
 if(o===0){if(c>0&&(k===0||L>0)){return 'chord';}if(L>0){return 'label';}}
 else if(c>=2&&c>o&&k===0){return 'chord';}
 if(/^\[[^\]]*\]$/.test(t)){return 'label';}
 return '';}
function isChordLine(l){return lineType(l)==='chord';}
/* Preferência de grafia: bemóis só se a cifra original usar mais bemóis que sustenidos */
function setPref(text){var L=text.split('\n'),i,j,p,q,m,r,f=0,s=0;
 for(i=0;i<L.length;i++){if(lineType(L[i])!=='chord'){continue;}p=L[i].split(/\s+/);
  for(j=0;j<p.length;j++){q=parseTok(p[j]);if(!q){continue;}m=chordParts(q.core);r=normN(m[1]);
   if(r.length>1){if(r.charAt(1)==='b'){f++;}else{s++;}}}}
 FLATPREF=f>s;}
function nt(r,n){r=normN(r);return (FLATPREF?FL:SH)[(((NI[r]+n)%12)+12)%12];}
function transTok(t,n){var p=parseTok(t);
 if(!p){if(/[|,;]/.test(t)&&tokKind(t)==='c'){return t.replace(/[^|,;]+/g,function(x){return transTok(x,n);});}return t;}
 var m=chordParts(p.core),o=nt(m[1],n)+m[2];
 if(m[3]!==undefined){var bp=m[3].split('/'),bi;for(bi=0;bi<bp.length;bi++){if(/^[A-G]/.test(bp[bi])){bp[bi]=nt(bp[bi],n);}}o+='/'+bp.join('/');}
 return p.pre+o+p.post;}
function transLine(l,n){var p=l.split(/(\s+)/),dbt=0,i;
 for(i=0;i<p.length;i+=2){var tok=p[i];if(!tok){continue;}
  var x=transTok(tok,n);p[i]=x;dbt+=x.length-tok.length;
  if(i+1<p.length&&dbt!==0){var sp=p[i+1],nl=Math.max(1,sp.length-dbt);dbt-=(sp.length-nl);p[i+1]=new Array(nl+1).join(' ');}}
 return p.join('');}
/* Acordes inline estilo [C]palavra dentro de linhas de letra */
function transInline(l,n){return l.replace(/\[([^\]\s]+)\]/g,function(m,c){return parseTok(c)?'['+transTok(c,n)+']':m;});}
/* Varredura global: transpõe TODOS os acordes do texto */
function transText(t,n){n=((n%12)+12)%12;t=norm(t);if(!n){return t;}
 setPref(t);var L=t.split('\n'),i,ty;
 for(i=0;i<L.length;i++){ty=lineType(L[i]);
  if(ty==='chord'){L[i]=transLine(L[i],n);}else if(ty===''){L[i]=transInline(L[i],n);}}
 return L.join('\n');}
function cleanText(t){t=norm(t);
 var junk=/^(simplificar cifra|afinador|ocultar tablatura|rolagem autom[aá]tica|auto ?rolagem|imprimir|favoritar|enviar corre[cç][aã]o|corrigir|ver mais|ver v[ií]deo ?aula|v[ií]deo ?aula|compartilhar|cifra club|cifraclub|adicionar [aà] lista|tom:?.{0,6}|publicidade|an[uú]ncio)$/i;
 var L=t.split('\n'),o=[],i,l;
 for(i=0;i<L.length;i++){l=L[i].replace(/\s+$/,'');var k=l.replace(/^\s+/,'');
  if(/https?:\/\/|www\.|cifraclub/i.test(k)){continue;}
  if(junk.test(k)){continue;}
  o.push(l);}
 return o.join('\n').replace(/\n{3,}/g,'\n\n').replace(/^\n+|\n+$/g,'');}
function chordSpans(l){var p=l.split(/(\s+)/),i,k,br=false,x;
 for(i=0;i<p.length;i+=2){x=p[i];if(!x){continue;}
  if(!br&&x.charAt(0)==='['&&!parseTok(x)&&x.indexOf(']')<0){br=true;p[i]='<span class="ch">'+esc(x)+'</span>';continue;}
  if(br){p[i]='<span class="ch">'+esc(x)+'</span>';if(x.indexOf(']')>=0){br=false;}continue;}
  k=tokKind(x);p[i]=(k==='w')?esc(x):'<span class="ch">'+esc(x)+'</span>';}
 for(i=1;i<p.length;i+=2){p[i]=esc(p[i]);}
 return p.join('');}
function inlineHtml(l,n){var re=/\[([^\]\s]+)\]/g,o='',last=0,m;
 while((m=re.exec(l))!==null){o+=esc(l.substring(last,m.index));
  if(parseTok(m[1])){o+='<span class="ch">['+esc(n?transTok(m[1],n):m[1])+']</span>';}else{o+=esc(m[0]);}
  last=m.index+m[0].length;}
 return o+esc(l.substring(last));}
function cifraHtml(text,n){n=((n%12)+12)%12;text=norm(text);setPref(text);
 var L=text.split('\n'),o=[],i,l,ty;
 for(i=0;i<L.length;i++){l=L[i];ty=lineType(l);
  if(ty==='chord'){o.push(chordSpans(n?transLine(l,n):l));}
  else if(ty==='label'){o.push('<span class="ch">'+esc(l)+'</span>');}
  else{o.push(inlineHtml(l,n));}}
 return o.join('\n');}

function metaOf(s){var m=[];if(s.favorite){m.push('★ favorita');}if(s.tempo){m.push('tempo: '+s.tempo);}if(s.themes&&s.themes.length){m.push(s.themes.join(', '));}
 return m.length?' &nbsp;·&nbsp; <small>'+esc(m.join(' · '))+'</small>':'';}
function bulkList(a,fn,max){var h='',i;for(i=0;i<a.length&&i<max;i++){h+='<div style="padding:6px 0;border-bottom:1px solid var(--bd)">'+fn(a[i])+'</div>';}
 if(a.length>max){h+='<div class="mu" style="padding:6px 0">… e mais '+(a.length-max)+'</div>';}return h;}
function renderBulk(){var b=S.bulk,h='<div class="bar"><button class="b mob" data-a="mback">◀ Lista</button><b class="ttl">Importar músicas em massa</b><span class="sp"></span><button class="b" data-a="bulkx">Voltar</button></div><div class="scr" style="padding:14px">';
 if(b&&b.done){var d=b.done;
  h+='<h3>Importação concluída</h3><p><b>'+d.imported+'</b> música(s) importada(s) &nbsp;·&nbsp; <b>'+d.dupIgnored+'</b> duplicata(s) ignorada(s) &nbsp;·&nbsp; <b>'+b.bad.length+'</b> inválida(s) ignorada(s) &nbsp;·&nbsp; total no arquivo: <b>'+b.total+'</b></p>';
  if(d.dupImported){h+='<p>Duplicatas importadas como cópias: <b>'+d.dupImported+'</b></p>';}
  h+='<p class="mu">Nenhuma música existente foi alterada ou apagada. A biblioteca agora tem '+D.songs.length+' música(s).</p>';
  if(b.dups.length){h+='<h4>Possíveis duplicatas</h4>'+bulkList(b.dups,function(x){return '<b>'+esc(x.song.title)+'</b> <span class="mu">('+(x.where==='arquivo'?'repetida no arquivo':'já na biblioteca')+': '+esc(x.match)+')</span>';},60);}
  if(b.bad.length){h+='<h4>Ignoradas (inválidas)</h4>'+bulkList(b.bad,function(x){return esc(x.title)+' <span class="mu">— '+esc(x.reason)+'</span>';},60);}}
 else{h+='<p>Selecione um arquivo JSON com uma lista de músicas (título, artista, letra/cifra, temas, favorito e tempo). Nada é apagado nem sobrescrito: a análise vem primeiro e você confirma depois.</p><input type="file" id="bf" accept=".json,application/json,text/plain">';
  if(b&&b.error){h+='<p style="color:var(--ac)"><b>'+esc(b.error)+'</b></p>';}
  else if(b){h+='<h3>Análise de “'+esc(b.name)+'”</h3><p>Registros no arquivo: <b>'+b.total+'</b><br>Novas músicas: <b>'+b.fresh.length+'</b><br>Possíveis duplicatas: <b>'+b.dups.length+'</b><br>Inválidas (serão ignoradas): <b>'+b.bad.length+'</b></p>'
   +'<p>Duplicatas: <select id="bd" style="flex:none;width:auto"><option value="skip">Ignorar (recomendado)</option><option value="copy">Importar mesmo assim, como cópias</option></select></p>'
   +'<p><button class="b p" data-a="bulkgo"'+((b.fresh.length||b.dups.length)?'':' disabled')+'>Importar agora</button></p>';
   if(b.dups.length){h+='<h4>Possíveis duplicatas</h4>'+bulkList(b.dups,function(x){return '<b>'+esc(x.song.title)+'</b> <span class="mu">('+(x.where==='arquivo'?'repetida no arquivo':'já na biblioteca')+': '+esc(x.match)+')</span>';},40);}
   if(b.bad.length){h+='<h4>Inválidas</h4>'+bulkList(b.bad,function(x){return esc(x.title)+' <span class="mu">— '+esc(x.reason)+'</span>';},40);}}}
 $('main').innerHTML=h+'</div>';
 var fi=$('bf');if(fi){fi.onchange=function(){var f=this.files&&this.files[0];if(!f){return;}var r=new FileReader();
  r.onload=function(){var d;try{d=JSON.parse(String(r.result).replace(/^\ufeff/,''));}catch(e){alert('O arquivo não é um JSON válido.');return;}
   S.bulk=bulkAnalyze(d,f.name,D.songs);renderBulk();};
  r.onerror=function(){alert('Não foi possível ler o arquivo.');};r.readAsText(f);};}}
function bulkRun(){var b=S.bulk;if(!b||b.done){return;}
 var copy=$('bd')&&$('bd').value==='copy',add=b.fresh.slice(),i,old=D.songs;
 if(copy){for(i=0;i<b.dups.length;i++){add.push(b.dups[i].song);}}
 D.songs=old.concat(add);
 try{localStorage.setItem(KEY,JSON.stringify(D));}
 catch(e){D.songs=old;alert('Não foi possível salvar: o armazenamento do navegador está cheio. Nada foi importado.');return;}
 b.done={imported:add.length,dupIgnored:copy?0:b.dups.length,dupImported:copy?b.dups.length:0};
 renderSide();renderBulk();}

/* ===== Migração: garante que TODO registro tenha a estrutura interna {id,title,artist,text[,themes,favorite,tempo]} ===== */
var SONG_KEYS={id:1,title:1,artist:1,text:1,themes:1,favorite:1,tempo:1};
function tempoStr(tp){return (typeof tp==='number')?(tp>0?String(Math.round(tp*100)/100):''):((tp===undefined||tp===null)?'':String(tp));}
function migrate(d){var DD=d||D;
 if(!isArr(DD.songs)){DD.songs=[];}
 if(!isArr(DD.sets)){DD.sets=[];}
 var used={},idmap={},changed=false,i,j,o,k,oid,nid,v,st,sused={};
 for(i=0;i<DD.songs.length;i++){o=DD.songs[i];
  if(!isObj(o)){DD.songs.splice(i,1);i--;changed=true;continue;}
  /* letra/cifra: campo interno é "text" (registros externos usam "lyrics", "letra"...) */
  if(typeof o.text!=='string'){v=(o.text!==undefined&&o.text!==null)?o.text:pick(o,BK.text);o.text=bulkText(v);changed=true;}
  if(typeof o.title!=='string'||!o.title){v=pick(o,BK.title);o.title=(v===undefined||v===null||String(v)==='')?'Sem título':String(v);changed=true;}
  if(typeof o.artist!=='string'){v=pick(o,BK.artist);o.artist=(v===undefined||v===null)?'':String(v);changed=true;}
  /* identificador: sempre texto, único */
  oid=o.id;nid=(oid===undefined||oid===null||oid==='')?'':String(oid);
  if(!nid||used['k_'+nid]){nid=uid();}
  if(typeof oid!=='string'||nid!==oid){changed=true;if(oid!==undefined&&oid!==null&&!idmap.hasOwnProperty('k_'+String(oid))){idmap['k_'+String(oid)]=nid;}}
  o.id=nid;used['k_'+nid]=1;
  /* campos opcionais com tipo correto */
  if(o.themes!==undefined&&!isArr(o.themes)){o.themes=bulkThemes(o.themes);changed=true;}
  if(o.favorite!==undefined&&typeof o.favorite!=='boolean'){o.favorite=bulkBool(o.favorite);changed=true;}
  if(o.tempo!==undefined&&typeof o.tempo!=='string'){o.tempo=tempoStr(o.tempo);changed=true;}
  /* remove campos de origem que não fazem parte do formato interno */
  for(k in o){if(o.hasOwnProperty(k)&&!SONG_KEYS.hasOwnProperty(k)){delete o[k];changed=true;}}}
 /* repertórios: ids sempre em texto, acompanhando a troca de ids acima */
 for(i=0;i<DD.sets.length;i++){st=DD.sets[i];
  if(!isObj(st)){DD.sets.splice(i,1);i--;changed=true;continue;}
  if(typeof st.id!=='string'||!st.id||sused['k_'+st.id]){st.id=(st.id!==undefined&&st.id!==null&&String(st.id)&&!sused['k_'+String(st.id)])?String(st.id):uid();changed=true;}
  sused['k_'+st.id]=1;
  if(typeof st.name!=='string'||!st.name){st.name=(st.name===undefined||st.name===null||String(st.name)==='')?'Repertório':String(st.name);changed=true;}
  if(!isArr(st.items)){st.items=[];changed=true;}
  for(j=0;j<st.items.length;j++){v='k_'+String(st.items[j]);
   if(idmap.hasOwnProperty(v)){st.items[j]=idmap[v];changed=true;}else if(typeof st.items[j]!=='string'){st.items[j]=String(st.items[j]);changed=true;}}}
 return changed;}

/* ===== Pesquisa local (100% offline) por título, artista e LETRA ===== */
var AC={'à':'a','á':'a','â':'a','ã':'a','ä':'a','è':'e','é':'e','ê':'e','ë':'e','ì':'i','í':'i','î':'i','ï':'i','ò':'o','ó':'o','ô':'o','õ':'o','ö':'o','ù':'u','ú':'u','û':'u','ü':'u','ç':'c','ñ':'n'};
var AR={a:'aàáâãä',e:'eèéêë',i:'iìíîï',o:'oòóôõö',u:'uùúûü',c:'cç',n:'nñ'};

function deb(f){if(stm){clearTimeout(stm);}stm=setTimeout(f,150);}
/* normaliza só para comparar: minúsculas, sem acentos, sem pontuação (o texto original nunca é alterado) */
function sn(s){return String(s||'').toLowerCase().replace(/[àáâãäèéêëìíîïòóôõöùúûüçñ]/g,function(c){return AC[c];}).replace(/[^a-z0-9]+/g,' ').replace(/^ | $/g,'');}
function noHy(s){return String(s||'').replace(/[-_]+/g,'');}
/* índice por música (só linhas de LETRA; linhas de acordes e rótulos ficam de fora) */
function sIndex(s){var id=String(s.id),x=SIDX[id];
 if(x&&x.src===s.text&&x.t===s.title&&x.ar===s.artist){return x;}
 var L=norm(s.text||'').split('\n'),ls=[],ln=[],i,l;
 for(i=0;i<L.length;i++){l=L[i];if(!/\S/.test(l)||lineType(l)){continue;}
  l=l.replace(/\[([^\]\s]+)\]/g,function(m,c){return parseTok(c)?'':m;}).replace(/^\s+|\s+$/g,'');
  if(l){ls.push(l);ln.push(sn(l));}}
 var j=ls.join(' ');
 x={src:s.text,t:s.title,ar:s.artist,ls:ls,ln:ln,tn:sn(s.title),tb:sn(noHy(s.title)),an:sn(s.artist),la:sn(j),lb:sn(noHy(j))};
 SIDX[id]=x;return x;}
function warmIdx(){var n=0;while(warmI<D.songs.length&&n<6){sIndex(D.songs[warmI++]);n++;}if(warmI<D.songs.length){setTimeout(warmIdx,30);}}
function wRx(w){var o=[],i,c;for(i=0;i<w.length;i++){c=w.charAt(i);o.push(AR.hasOwnProperty(c)?'['+AR[c]+']':c);}return o.join('[-_]*');}
function sQuery(q){var qa=sn(q);if(qa.length<2){return null;}
 var wa=qa.split(' '),qb=sn(noHy(q)),ws=[],i;
 for(i=0;i<wa.length;i++){if(wa[i].length>1){ws.push(wRx(wa[i]));}}
 return {qa:qa,qb:qb,wa:wa,wb:qb.split(' '),ph:new RegExp(wa.map(wRx).join('[^A-Za-z0-9\u00c0-\u00ff]+'),'i'),any:ws.length?new RegExp(ws.join('|'),'i'):null};}
function hasAll(h,w){var i;for(i=0;i<w.length;i++){if(h.indexOf(w[i])<0){return false;}}return true;}
function sScore(x,Q){var sc=0,i,w,ws=[];
 if(x.tn.indexOf(Q.qa)>=0||x.tb.indexOf(Q.qb)>=0){sc=x.tn.indexOf(Q.qa)===0?110:100;}
 else if(Q.wa.length>1&&hasAll(x.tn,Q.wa)){sc=80;}
 if(sc<100&&(x.la.indexOf(Q.qa)>=0||x.lb.indexOf(Q.qb)>=0)){sc=Math.max(sc,60);}
 if(sc<60&&Q.wa.length>1){for(i=0;i<Q.wa.length;i++){if(Q.wa[i].length>1){ws.push(Q.wa[i]);}}
  if(ws.length>1){for(i=0;i<x.ln.length;i++){w=x.ln[i]+' '+(x.ln[i+1]||'');if(hasAll(w,ws)){sc=Math.max(sc,30);break;}}}}
 if(!sc&&x.an.indexOf(Q.qa)>=0){sc=20;}
 return sc;}
function sSearch(Q,ids){var src=[],by={},seen={},res=[],i,s,x,sc;
 if(ids){for(i=0;i<D.songs.length;i++){by['k_'+D.songs[i].id]=D.songs[i];}
  for(i=0;i<ids.length;i++){s=by['k_'+ids[i]];if(s&&!seen['k_'+s.id]){seen['k_'+s.id]=1;src.push(s);}}}else{src=D.songs;}
 for(i=0;i<src.length;i++){s=src[i];x=sIndex(s);sc=sScore(x,Q);if(sc>0){res.push({song:s,score:sc,x:x});}}
 res.sort(function(a,b){return (b.score-a.score)||a.song.title.toLowerCase().localeCompare(b.song.title.toLowerCase());});
 return res;}
function hl(s,rx){rx=new RegExp(rx.source,'gi');var o='',last=0,m;
 while((m=rx.exec(s))!==null){if(!m[0]){rx.lastIndex++;continue;}o+=esc(s.substring(last,m.index))+'<mark>'+esc(m[0])+'</mark>';last=m.index+m[0].length;}
 return o+esc(s.substring(last));}
function hlBest(t,Q){if(Q.ph.test(t)){return hl(t,Q.ph);}if(Q.any&&Q.any.test(t)){return hl(t,Q.any);}return esc(t);}
/* prévia do trecho da letra onde o termo foi encontrado, com destaque */
function snipFor(x,Q){var ls=x.ls,i,t,rx=null,base='',m,a;
 for(i=0;i<ls.length;i++){if(Q.ph.test(ls[i])){base=ls[i];rx=Q.ph;if(base.length<45&&ls[i+1]){base+=' / '+ls[i+1];}break;}}
 if(!rx){for(i=0;i+1<ls.length;i++){t=ls[i]+' '+ls[i+1];if(Q.ph.test(t)){base=t;rx=Q.ph;break;}}}
 if(!rx&&Q.any){for(i=0;i<ls.length;i++){if(Q.any.test(ls[i])){base=ls[i]+(ls[i+1]?' / '+ls[i+1]:'');rx=Q.any;break;}}}

 return hl(base,rx);}

function readBackup(txt){var d=JSON.parse(String(txt).replace(/^\ufeff/,'')),arr,have={},i,j,st,k,dropped=0;
 if(isArr(d)){d={songs:d,sets:[]};}
 if(!isObj(d)){return null;}

  for(j=0;j<st.items.length;j++){if(have['k_'+st.items[j]]){k.push(st.items[j]);}else{dropped++;}}

  e=byId['k_'+s.id];if(e&&dkey(e.title)===tk){hit=e;}

function pick(o,list){var low={},key,k,n;
 for(key in o){if(o.hasOwnProperty(key)){low[key.toLowerCase().replace(/[\s_\-]/g,'')]=o[key];}}
 for(k=0;k<list.length;k++){n=list[k].replace(/[\s_\-]/g,'');if(low.hasOwnProperty(n)&&low[n]!==null&&low[n]!==undefined){return low[n];}}
 return undefined;}
function looksSong(o){return isObj(o)&&pick(o,BK.title)!==undefined;}
/* Localiza a lista de músicas: array na raiz, array dentro de um objeto, mapa id->música ou música única */
function findSongs(r,d){var k,v,res,vals=[],all=true;
 if(isArr(r)){return (r.length&&isObj(r[0]))?r:null;}
 if(!isObj(r)||d>3){return null;}
 if(looksSong(r)&&pick(r,BK.text)!==undefined){return [r];}
 for(k in r){if(r.hasOwnProperty(k)){vals.push(r[k]);if(!looksSong(r[k])){all=false;}}}
 if(vals.length&&all){return vals;}
 for(k in r){if(r.hasOwnProperty(k)){v=r[k];
  if(isArr(v)||isObj(v)){res=findSongs(v,d+1);if(res&&res.length&&looksSong(res[0])){return res;}}}}
 return null;}
function bulkText(v){if(v===null||v===undefined){return '';}
 if(isArr(v)){v=v.join('\n');}v=String(v);
 if(/<br\s*\/?>|<\/(p|div|pre)>/i.test(v)){
  v=v.replace(/<br\s*\/?>/gi,'\n').replace(/<\/(p|div)>/gi,'\n').replace(/<[^>]+>/g,'').replace(/&nbsp;/g,' ').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&amp;/g,'&');}
 v=norm(v);
 return v.replace(/^(\s*\n)+/,'').replace(/\s+$/,'');}
function bulkBool(f){if(f===true||f===1){return true;}if(typeof f==='string'){return /^(true|1|sim|yes|s|y|x)$/i.test(f.replace(/\s/g,''));}return false;}
function bulkThemes(th){var out=[],seen={},a=[],i,t;
 if(th===undefined||th===null){return out;}
 if(isArr(th)){for(i=0;i<th.length;i++){t=th[i];if(isObj(t)){t=pick(t,BK.title);}if(t!==undefined&&t!==null){a.push(String(t));}}}
 else if(isObj(th)){for(t in th){if(th.hasOwnProperty(t)){a.push(String(th[t]===true?t:th[t]));}}}
 else{a=String(th).split(/[,;|\/]+/);}
 for(i=0;i<a.length;i++){t=a[i].replace(/^\s+|\s+$/g,'');if(t&&!seen['k_'+t.toLowerCase()]){seen['k_'+t.toLowerCase()]=1;out.push(t);}}
 return out;}
/* Converte um registro externo para o formato interno {id,title,artist,text,themes,favorite,tempo} */
function bulkNorm(o){
 if(!isObj(o)){return {err:'Registro inválido'};}
 var t=pick(o,BK.title),a=pick(o,BK.artist),x=bulkText(pick(o,BK.text)),tp=pick(o,BK.tempo);
 t=(t===undefined||t===null)?'':String(t).replace(/^\s+|\s+$/g,'');
 a=(a===undefined||a===null)?'':String(a).replace(/^\s+|\s+$/g,'');
 if(!t){return {err:'Sem título'};}
 if(!x.replace(/\s+/g,'')){return {err:'Sem letra/cifra',title:t};}
 return {song:{id:uid(),title:t,artist:a,text:x,themes:bulkThemes(pick(o,BK.themes)),favorite:bulkBool(pick(o,BK.favorite)),tempo:(typeof tp==='number')?(tp>0?String(Math.round(tp*100)/100):''):((tp===undefined||tp===null)?'':String(tp))}};}
function dkey(s){s=String(s||'').toLowerCase();try{s=s.normalize('NFD');}catch(e){}return s.replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]/g,'');}
/* Analisa o JSON sem alterar a biblioteca: separa novas, possíveis duplicatas e inválidas */
function bulkAnalyze(data,name,lib){
 var arr=findSongs(data,0),r={name:name,total:0,fresh:[],dups:[],bad:[]};
 if(!arr){r.error='Não encontrei uma lista de músicas neste arquivo.';return r;}
 var idx={},i,s,k,n,tk,ak,L,j,hit,w;
 function add(t,a,src){tk='k_'+dkey(t);if(!idx[tk]){idx[tk]=[];}idx[tk].push({a:dkey(a),src:src,t:t,ar:a});}
 for(i=0;i<lib.length;i++){add(lib[i].title,lib[i].artist||'','biblioteca');}
 r.total=arr.length;
 for(i=0;i<arr.length;i++){n=bulkNorm(arr[i]);
  if(n.err){r.bad.push({title:n.title||('Registro '+(i+1)),reason:n.err});continue;}
  s=n.song;tk='k_'+dkey(s.title);ak=dkey(s.artist);L=idx[tk]||[];hit=null;
  for(j=0;j<L.length;j++){if(L[j].a===ak||!L[j].a||!ak){hit=L[j];break;}}
  if(hit){r.dups.push({song:s,where:hit.src,match:hit.t+(hit.ar?' — '+hit.ar:'')});}
  else{r.fresh.push(s);add(s.title,s.artist,'arquivo');}}
 return r;}
